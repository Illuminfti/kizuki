<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Kizuki</title>
    <link rel="stylesheet" href="/app/assets/app.css">
    <script src="/app/assets/client.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Kizuki navigation">
        <a class="wordmark" href="#memory" aria-label="Kizuki, your memory">
          <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8 6v20M24 6 13 16l11 10" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25" cy="6" r="3" fill="currentColor"/></svg>
          <span>Kizuki</span>
        </a>
        <nav id="navigation" aria-label="Main"></nav>
        <div class="sidebar-footer"><span class="privacy-dot" aria-hidden="true"></span><span>Yours, on this device.</span></div>
      </aside>
      <div class="workspace">
        <header class="topbar"><span id="view-label">Memory</span><div class="topbar-actions"><span class="local-label">Local workspace</span><button type="button" class="icon-button" id="refresh" aria-label="Refresh workspace" title="Refresh"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 6M19 3v5h-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></header>
        <main id="main" tabindex="-1"><div class="opening" aria-busy="true"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-panel"></div><p>Opening your Kizuki…</p></div></main>
      </div>
    </div>
    <div id="notification" class="notification" role="status" aria-live="polite" hidden></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <noscript><p class="noscript">Kizuki uses JavaScript to connect this local interface to your memory. Enable it for this page, then reload.</p></noscript>
  </body>
</html>
