name: agent-source-export

on:
  push:
    branches:
      - agent/launch-campaign-source-20260903

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agent-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Install exact dependencies
        shell: bash
        run: bun install --frozen-lockfile
      - name: Capture live coordination state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .agent-devkit/bin .agent-devkit/live
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" > .agent-devkit/live/open-issues-pages.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > .agent-devkit/live/open-pulls-pages.json
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" > .agent-devkit/live/check-runs.json
      - name: Pack exact development snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp "$(command -v bun)" .agent-devkit/bin/bun
          chmod 0755 .agent-devkit/bin/bun
          printf '%s\n' "$GITHUB_SHA" > .agent-source-sha
          tar --exclude=.git -czf /tmp/kizuki-devkit.tgz .
      - name: Upload development snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kizuki-devkit-${{ github.sha }}
          path: /tmp/kizuki-devkit.tgz
          if-no-files-found: error
          retention-days: 1
