name: workspace-snapshot

on:
  push:
    branches:
      - ops/pr421-snapshot-20260904

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: install exact lockfile
        run: bun install --frozen-lockfile
      - name: package exact-head workspace
        run: |
          mkdir -p .tooling
          cp "$(command -v bun)" .tooling/bun
          tar --exclude=.git --exclude=./.git -czf "$RUNNER_TEMP/kizuki-pr421-workspace.tar.gz" .
      - name: upload exact-head workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kizuki-pr421-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/kizuki-pr421-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
