name: exact workspace audit

on:
  push:
    branches:
      - agent/complete-outstanding-20260903

permissions:
  contents: read

concurrency:
  group: exact-workspace-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: keep origin/main only
        run: bash scripts/ci-restrict-origin-refs.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: verify exact workspace
        run: bun run verify
      - name: package verified workspace
        run: |
          mkdir -p .tooling
          cp "$(command -v bun)" .tooling/bun
          tar --exclude=.git --exclude=./.git -czf "$RUNNER_TEMP/kizuki-live-workspace.tar.gz" .
      - name: upload verified workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kizuki-live-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/kizuki-live-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
