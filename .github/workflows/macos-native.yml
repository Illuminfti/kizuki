name: macos-native
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact ancestor commit SHA for the reviewed diff
        required: true
        type: string
      existing_allowance_verified:
        description: Existing allowance and spending cap verified to cover this run without new cost
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: macos-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-arm64:
    if: ${{ inputs.existing_allowance_verified == true }}
    runs-on: macos-15
    timeout-minutes: 15
    env:
      KIZUKI_TARGET: bun-darwin-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: keep origin/main only
        run: bash scripts/ci-restrict-origin-refs.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.10 }
      - name: exact-head diff integrity
        run: bun scripts/ci-diff-check.ts
      - name: native host and immutable dependency install
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          bun install --frozen-lockfile
      - name: platform tests
        run: |
          bun run typecheck
          bun test scripts/release-targets.test.ts scripts/release-artifacts.test.ts scripts/stranger-proof.test.ts packages/core/test/serve/advisory-file-lock.test.ts packages/core/test/serve/flock.test.ts packages/core/test/serve/leases.test.ts packages/core/test/serve/units.test.ts packages/core/test/serve/service-arguments.test.ts packages/cli/test/config.test.ts packages/cli/test/terminal-prompt.test.ts packages/tui/test/terminal.test.ts packages/retrieval-pg/test/contention.test.ts scripts/native-platform.test.ts
      - name: native package and copied-artifact proof
        run: |
          bun run build:release
          bun run smoke:release
          bun run proof:artifact -- --report "$RUNNER_TEMP/kizuki-macos-artifact-proof"
      - name: retain native package and receipt in this repository only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-${{ github.sha }}
          path: |
            dist/kizuki-*/bun-darwin-arm64/
            ${{ runner.temp }}/kizuki-macos-artifact-proof/receipt.json
          retention-days: 7
          if-no-files-found: error
