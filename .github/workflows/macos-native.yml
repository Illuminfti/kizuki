name: macos-native
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact ancestor commit SHA for the reviewed diff
        required: true
        type: string
      existing_allowance_verified:
        description: Existing allowance and spending cap verified to cover this run without new cost
        required: true
        default: false
        type: boolean
      native_adapter_only:
        description: Run the bounded Darwin owned-directory adapter proof without full product qualification
        required: false
        default: false
        type: boolean
      native_lifecycle_only:
        description: Qualify installed services on both native public standard runners
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: macos-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-arm64:
    if: ${{ inputs.existing_allowance_verified == true && inputs.native_lifecycle_only != true }}
    runs-on: macos-15
    timeout-minutes: 15
    env:
      KIZUKI_TARGET: bun-darwin-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: keep origin/main only
        run: bash scripts/ci-restrict-origin-refs.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.14 }
      - name: exact-head diff integrity
        run: bun scripts/ci-diff-check.ts
      - name: native host and immutable dependency install
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          bun install --frozen-lockfile
          export TMPDIR="$(bun -e 'console.log(require("node:fs").realpathSync(process.env.RUNNER_TEMP))')"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
      - name: platform tests
        if: ${{ inputs.native_adapter_only != true }}
        run: |
          bun run typecheck
          bun test scripts/release-targets.test.ts scripts/release-artifacts.test.ts scripts/stranger-proof.test.ts packages/core/test/serve/advisory-file-lock.test.ts packages/core/test/serve/flock.test.ts packages/core/test/serve/leases.test.ts packages/core/test/serve/units.test.ts packages/core/test/serve/service-arguments.test.ts packages/cli/test/config.test.ts packages/cli/test/terminal-prompt.test.ts packages/tui/test/terminal.test.ts packages/retrieval-pg/test/contention.test.ts scripts/native-platform.test.ts
          bun test packages/core/test/ledger-wal.test.ts packages/core/test/ledger-lifetime.test.ts packages/connector-ics/test/ingest-completion.test.ts packages/connectors/test/fleet-markdown-lifecycle.test.ts packages/cli/test/import-markdown-lifecycle.test.ts packages/core/test/ledger-identity.test.ts packages/core/test/canon/canon-files.test.ts packages/core/test/canon/receipt-stream.test.ts packages/core/test/canon/apply.test.ts packages/core/test/vault/mutation-scope.test.ts packages/core/test/vault/mutation-callers.test.ts packages/core/test/agents/credential-file.test.ts packages/core/test/agents/app-enrollment.test.ts packages/core/test/agents/enrollment-flow.test.ts packages/core/test/agents/enrollment-preview.test.ts packages/core/test/agents/enrollment-fault.test.ts packages/core/test/correction/correct.test.ts packages/core/test/correction/source-consent.test.ts packages/core/test/serve/stop-control.test.ts packages/cli/test/serve-stop.test.ts packages/core/test/serve/model-settings.test.ts packages/core/test/serve/model-diagnostics.test.ts packages/core/test/serve/app-http.test.ts packages/cli/test/app-host.test.ts packages/cli/test/app-agents.test.ts packages/cli/test/app-client.test.ts packages/cli/test/app-service.test.ts packages/cli/test/app-browser.test.ts packages/cli/test/app-model-settings.test.ts packages/cli/test/app-model-journey.test.ts packages/cli/test/app-privacy-races.test.ts packages/mcp/test/credential-stdio.test.ts packages/core/test/canon/crash-recovery.test.ts packages/core/test/canon/ordinary-receipt-recovery.test.ts packages/core/test/canon/staged-publication.test.ts packages/core/test/canon/recovery-boundaries.test.ts packages/cli/test/recovery-public.test.ts packages/core/test/serving/read-context.test.ts packages/cli/test/read-context.test.ts packages/core/test/canon/canon-files-ancestry.test.ts scripts/native-service-ancestry.test.ts packages/core/test/connections-operation-lock.test.ts packages/core/test/serve/custody-native.test.ts packages/core/test/serve/custody-observation.test.ts packages/core/test/serve/custody.test.ts packages/cli/test/serve/custody.test.ts
      - name: native package and copied-artifact proof
        if: ${{ inputs.native_adapter_only != true }}
        run: |
          bun run build:release
          bun run smoke:release
          bun run proof:artifact -- --report "$RUNNER_TEMP/kizuki-macos-artifact-proof"
      - name: require artifact proof receipt
        if: ${{ inputs.native_adapter_only != true }}
        run: test -f "$RUNNER_TEMP/kizuki-macos-artifact-proof/receipt.json"
      - name: retain native package and receipt in this repository only
        if: ${{ success() && inputs.native_adapter_only != true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-${{ github.sha }}
          path: |
            dist/kizuki-*/bun-darwin-arm64/
            ${{ runner.temp }}/kizuki-macos-artifact-proof/receipt.json
          retention-days: 7
          if-no-files-found: error
      - name: Darwin owned-directory adapter canary
        if: ${{ !cancelled() && inputs.native_adapter_only == true }}
        run: |
          bun run typecheck
          bun scripts/darwin-native-canary.ts --report "$RUNNER_TEMP/kizuki-darwin-native-canary"
          bun test packages/core/test/util/native-loader.test.ts packages/core/test/util/native-enumeration.test.ts packages/core/test/util/owned-directory.test.ts packages/core/test/util/owned-directory-publication.test.ts
      - name: require Darwin adapter canary receipt
        if: ${{ !cancelled() && inputs.native_adapter_only == true }}
        run: test -f "$RUNNER_TEMP/kizuki-darwin-native-canary/receipt.json"
      - name: retain Darwin adapter canary receipt and executable
        if: ${{ !cancelled() && inputs.native_adapter_only == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-native-adapter-${{ github.sha }}
          path: ${{ runner.temp }}/kizuki-darwin-native-canary/
          retention-days: 7
          if-no-files-found: error
  native-service:
    if: ${{ inputs.existing_allowance_verified == true && inputs.native_lifecycle_only == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: keep origin/main only
        run: bash scripts/ci-restrict-origin-refs.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.14 }
      - name: exact-head diff integrity
        run: bun scripts/ci-diff-check.ts
      - name: immutable dependency install and harness tests
        run: |
          bun install --frozen-lockfile
          export TMPDIR="$(bun -e 'console.log(require("node:fs").realpathSync(process.env.RUNNER_TEMP))')"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
          bun run typecheck
          bun test scripts/native-service-lifecycle.test.ts
          bun test packages/core/test/ledger-wal.test.ts packages/core/test/ledger-lifetime.test.ts packages/connector-ics/test/ingest-completion.test.ts packages/connectors/test/fleet-markdown-lifecycle.test.ts packages/cli/test/import-markdown-lifecycle.test.ts packages/core/test/ledger-identity.test.ts packages/core/test/canon/canon-files.test.ts packages/core/test/canon/receipt-stream.test.ts packages/core/test/canon/apply.test.ts packages/core/test/vault/mutation-scope.test.ts packages/core/test/vault/mutation-callers.test.ts packages/core/test/agents/credential-file.test.ts packages/core/test/agents/app-enrollment.test.ts packages/core/test/agents/enrollment-flow.test.ts packages/core/test/agents/enrollment-preview.test.ts packages/core/test/agents/enrollment-fault.test.ts packages/core/test/correction/correct.test.ts packages/core/test/correction/source-consent.test.ts packages/core/test/serve/stop-control.test.ts packages/cli/test/serve-stop.test.ts packages/core/test/serve/model-settings.test.ts packages/core/test/serve/model-diagnostics.test.ts packages/core/test/serve/app-http.test.ts packages/cli/test/app-host.test.ts packages/cli/test/app-agents.test.ts packages/cli/test/app-client.test.ts packages/cli/test/app-service.test.ts packages/cli/test/app-browser.test.ts packages/cli/test/app-model-settings.test.ts packages/cli/test/app-model-journey.test.ts packages/cli/test/app-privacy-races.test.ts packages/mcp/test/credential-stdio.test.ts packages/core/test/canon/crash-recovery.test.ts packages/core/test/canon/ordinary-receipt-recovery.test.ts packages/core/test/canon/staged-publication.test.ts packages/core/test/canon/recovery-boundaries.test.ts packages/cli/test/recovery-public.test.ts packages/core/test/serving/read-context.test.ts packages/cli/test/read-context.test.ts packages/core/test/canon/canon-files-ancestry.test.ts scripts/native-service-ancestry.test.ts packages/core/test/connections-operation-lock.test.ts packages/core/test/serve/custody-native.test.ts packages/core/test/serve/custody-observation.test.ts packages/core/test/serve/custody.test.ts packages/cli/test/serve/custody.test.ts
      - name: start the ephemeral Linux runner user manager
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: build the exact native package
        run: |
          bun run build:release
          bun run smoke:release
          bun run proof:artifact -- --report "$RUNNER_TEMP/kizuki-native-artifact-proof"
      - name: qualify the copied package against the native user service manager
        run: bun scripts/native-service-lifecycle.ts --report "$RUNNER_TEMP/kizuki-native-service-lifecycle"
      - name: retain lifecycle receipt even when a native gate fails
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-service-lifecycle-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/kizuki-*/bun-linux-x64-baseline/
            dist/kizuki-*/bun-darwin-arm64/
            ${{ runner.temp }}/kizuki-native-artifact-proof/receipt.json
            ${{ runner.temp }}/kizuki-native-service-lifecycle/receipt.json
          retention-days: 7
          if-no-files-found: error
