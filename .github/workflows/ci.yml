name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: keep origin/main only
        run: bash scripts/ci-restrict-origin-refs.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.10 }
      - name: refuse a shallow history
        run: test "$(git rev-parse --is-shallow-repository)" = "false"
      - name: verify
        run: bun run verify
      - name: exact-head diff integrity
        run: |
          git fetch --no-tags origin main
          git diff --check FETCH_HEAD...HEAD
      - name: copy pinned toolchain
        if: always()
        run: |
          mkdir -p .tooling
          cp "$(command -v bun)" .tooling/bun
      - name: package exact-head workspace
        if: always()
        run: tar --exclude=.git --exclude=./.git --exclude=kizuki-workspace.tar.gz -czf kizuki-workspace.tar.gz .
      - name: upload exact-head workspace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kizuki-workspace-${{ github.sha }}
          path: kizuki-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  secrets:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: keep origin/main only
        run: bash scripts/ci-restrict-origin-refs.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.10 }
      - name: secret patterns
        run: bun run ci:secrets
      - name: gitleaks
        run: bash scripts/ci-gitleaks.sh
