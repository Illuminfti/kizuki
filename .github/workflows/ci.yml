name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: keep origin/main only
        run: bash scripts/ci-restrict-origin-refs.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.14 }
      - name: refuse a shallow history
        run: test "$(git rev-parse --is-shallow-repository)" = "false"
      - name: verify
        run: bun run verify
      - name: native package smoke
        run: |
          bun run build:release
          bun run smoke:release
          bun run proof:artifact -- --report "$RUNNER_TEMP/kizuki-artifact-proof"
      - name: exact-head diff integrity
        run: bun scripts/ci-diff-check.ts
      - name: retain native package and receipt in this repository only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/kizuki-*/bun-linux-x64-baseline/
            ${{ runner.temp }}/kizuki-artifact-proof/receipt.json
          retention-days: 7
          if-no-files-found: error
  secrets:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: keep origin/main only
        run: bash scripts/ci-restrict-origin-refs.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.14 }
      - name: secret patterns
        run: bun run ci:secrets
      - name: gitleaks
        run: bash scripts/ci-gitleaks.sh
