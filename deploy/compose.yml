# M1 container floor plus M2 tailnet access (docs/deploy-box-tailscale.md).
#
# Shape: two services share one network namespace. `tailscale` is the only
# service with a route to anything outside the box; `kizuki` keeps M1's
# hardening (read-only rootfs, cap_drop: [ALL], no capabilities, no
# devices) and gets `network_mode: service:tailscale` instead of its own
# network, so it publishes no `ports:` of its own and tailscaled reaches it
# on 127.0.0.1 — the exact host `packages/core/src/serve/http.ts`
# `startServeHttp` already accepts. Userspace networking
# (`TS_USERSPACE=true`) means neither service needs `NET_ADMIN` or
# `/dev/net/tun`.
services:
  tailscale:
    image: tailscale/tailscale@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    entrypoint: ["/local/entrypoint.sh"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    environment:
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: kizuki-m2-proof
      # deploy/tailscale/serve.json is a raw TCP forward (TCPForward), not
      # an HTTPS reverse proxy. See the M2 Finding in
      # docs/deploy-box-tailscale.md: `tailscale serve`'s HTTP proxy
      # forwards the tailnet FQDN as the Host header, which
      # startServeHttp's loopback-only check 403s on with no
      # configuration-only fix. Raw TCP forwarding does no HTTP parsing or
      # rewriting at all, so the Host header a client sends reaches Kizuki
      # untouched; a client that sends `Host: 127.0.0.1` satisfies the
      # check with no change to core and no proxy component in this repo.
      TS_SERVE_CONFIG: /local/serve.json
      TS_AUTHKEY_FILE: /run/secrets/ts_authkey
      # No --ssh, no --advertise-routes, no --advertise-exit-node: a hosted
      # box deliberately exposes no shell. This is what keeps a customer who
      # only has tailnet access from taking this box's compute or reaching
      # another service in the same tailnet namespace; a shell is a property
      # of the customer-owned deployment tier (their own box, their own
      # tailnet), never of a box we run on our own infrastructure account.
      # Row 2.11 of the M2 finish line now asserts this refusal directly.
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/entrypoint.sh:/local/entrypoint.sh:ro
      - ./tailscale/serve.json:/local/serve.json:ro
    secrets:
      # cap_drop: [ALL] on this service removes CAP_DAC_OVERRIDE, so this
      # container's root cannot read a secret at a mode that denies "other"
      # access (see the `secrets:` block below and the M2 Finding in
      # docs/deploy-box-tailscale.md for why Compose's own `mode:` override
      # does not help). The key file itself is mode 0644, but that is not a
      # world-readable credential: its containing directory,
      # /home/lars/.config/kizuki, is mode 0700, so no local user other than
      # its owner can traverse into the directory to open the file at all,
      # regardless of the file's own mode. The file's mode only has to
      # satisfy the DAC check once something can already reach it.
      - ts_authkey

  kizuki:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:tailscale
    depends_on:
      - tailscale
    tmpfs:
      - /tmp
    volumes:
      - kizuki-vault:/vault
    environment:
      KIZUKI_HTTP_PORT: "8787"

volumes:
  kizuki-vault: {}
  tailscale-state: {}

secrets:
  # Docker Compose secrets outside Swarm mode are plain bind mounts of the
  # host file, mode and owner included: the `mode`/`uid`/`gid` overrides
  # Compose accepts in a service's `secrets:` list are Swarm-only and are
  # silently ignored on a plain engine (confirmed empirically; see the M2
  # Finding in docs/deploy-box-tailscale.md). The real key file's own mode
  # is therefore what the container gets, and it must be readable by
  # "other" for a cap_drop: [ALL] container's root to open it at all
  # (CAP_DAC_OVERRIDE is gone). The key file is 0644; that does not make it
  # world-readable in practice because its containing directory,
  # /home/lars/.config/kizuki, is 0700 — no other local user can traverse
  # into that directory to reach the file regardless of the file's own
  # mode, so the directory's permission is what actually protects the key,
  # exactly as it would for any other file that same directory holds.
  # `deploy/proof/tailnet.sh` asserts both modes as a precondition.
  # KIZUKI_TS_AUTHKEY_FILE only ever points at a different real key file at
  # a path with the same directory-then-file permission shape; it must
  # never point at a loosened copy of a key that lives somewhere else.
  ts_authkey:
    file: ${KIZUKI_TS_AUTHKEY_FILE:-/home/lars/.config/kizuki/ts-authkey}
